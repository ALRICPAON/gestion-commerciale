<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plans de nettoyage - ALTA MAREE</title>
  <link rel="stylesheet" href="../../css/app.css" />
  <link rel="stylesheet" href="../css/quality.css?v=7" />
</head>
<body class="app-page">
  <header class="topbar"><div class="topbar-left"><h1 class="app-title">ALTA MAREE</h1><p class="app-subtitle">Plans Nettoyage</p></div><div class="topbar-right"><button class="btn btn-secondary" onclick="window.location.href='./cleaning-records.html'">Realiser</button><button class="btn btn-secondary" onclick="window.location.href='./dashboard.html'">Qualite</button><button class="btn btn-secondary" onclick="window.location.href='../../home.html'">Accueil</button></div></header>
  <main class="main-content">
    <section class="welcome-card"><span class="section-kicker">Nettoyage & Desinfection</span><h2>Plans de nettoyage</h2><p>Regles metier liees au planning qualite.</p></section>
    <div id="cleaning-plans-feedback" class="page-feedback hidden"></div>
    <section class="quality-card"><div class="quality-actions"><button id="cleaning-plan-add-btn" class="btn btn-primary" type="button">Creer un plan</button></div></section>
    <section id="cleaning-plan-form-card" class="quality-card hidden">
      <h3 id="cleaning-plan-form-title">Nouveau plan</h3>
      <form id="cleaning-plan-form" class="quality-form-grid">
        <input id="cleaning-plan-id" type="hidden">
        <label>Titre * <input id="cleaning-plan-title" class="form-input" required></label>
        <label>Zones<select id="cleaning-plan-zone-ids" class="form-input" multiple size="5"></select></label>
        <label>Recherche equipement<input id="cleaning-plan-equipment-search" class="form-input" type="search"></label>
        <fieldset class="quality-form-wide quality-target-fieldset">
          <legend>Equipements</legend>
          <div class="quality-actions"><button id="cleaning-plan-select-zone-equipments" class="btn btn-secondary" type="button">Tout selectionner par zone</button><button id="cleaning-plan-clear-equipments" class="btn btn-secondary" type="button">Vider</button></div>
          <div id="cleaning-plan-equipment-options" class="quality-checkbox-grid"></div>
        </fieldset>
        <label>Produit utilise<input id="cleaning-plan-product" class="form-input"></label>
        <label>Duree prevue (min)<input id="cleaning-plan-duration" class="form-input" type="number" min="1"></label>
        <label><input id="cleaning-plan-active" type="checkbox" checked> Actif</label>
        <label class="quality-form-wide">Methode<textarea id="cleaning-plan-method" class="form-input" rows="3"></textarea></label>
        <label class="quality-form-wide">Consignes securite<textarea id="cleaning-plan-safety" class="form-input" rows="2"></textarea></label>
        <label class="quality-form-wide">Description<textarea id="cleaning-plan-description" class="form-input" rows="2"></textarea></label>
        <fieldset class="quality-form-wide quality-inline-fieldset">
          <legend>Planification qualite</legend>
          <label>Mode<select id="cleaning-plan-planning-mode" class="form-input"><option value="existing">Tache qualite existante</option><option value="new">Creer une nouvelle tache</option><option value="none">Non planifie</option></select></label>
          <label id="cleaning-plan-existing-task-label">Tache existante<select id="cleaning-plan-quality-task-id" class="form-input"></select></label>
          <label id="cleaning-plan-task-title-label">Titre tache<input id="cleaning-plan-task-title" class="form-input"></label>
          <label id="cleaning-plan-task-responsible-label">Responsable<select id="cleaning-plan-task-responsible" class="form-input"><option value="">Non assigne</option></select></label>
          <label id="cleaning-plan-frequency-value-label">Frequence<input id="cleaning-plan-frequency-value" class="form-input" type="number" min="1"></label>
          <label id="cleaning-plan-frequency-unit-label">Unite<select id="cleaning-plan-frequency-unit" class="form-input"><option value="">Non definie</option><option value="hours">Heures</option><option value="days">Jours</option><option value="weeks">Semaines</option><option value="months">Mois</option><option value="events">Evenements</option></select></label>
          <label id="cleaning-plan-target-time-label">Heure cible<input id="cleaning-plan-target-time" class="form-input" type="time"></label>
          <fieldset id="cleaning-plan-scheduled-days-label" class="quality-form-wide quality-inline-fieldset">
            <legend>Jours actifs</legend>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="monday"> Lundi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="tuesday"> Mardi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="wednesday"> Mercredi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="thursday"> Jeudi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="friday"> Vendredi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="saturday"> Samedi</label>
            <label><input type="checkbox" name="cleaning-plan-scheduled-day" value="sunday"> Dimanche</label>
          </fieldset>
        </fieldset>
        <div class="quality-actions quality-form-wide"><button class="btn btn-primary" type="submit">Enregistrer</button><button id="cleaning-plan-cancel-btn" class="btn btn-secondary" type="button">Annuler</button></div>
      </form>
    </section>
    <section id="cleaning-plan-document-links" class="quality-list-grid"></section>
    <section id="cleaning-plan-list" class="quality-list-grid"></section>
  </main>
  <script src="../../js/config.js"></script><script src="../js/permissions.js"></script><script src="../js/quality-document-links.js?v=2"></script><script src="../js/digital-twin-api.js"></script><script src="../js/tasks-api.js?v=2"></script><script src="../js/cleaning-api.js?v=1"></script><script src="../js/cleaning-plans.js?v=4"></script>
</body>
</html>
